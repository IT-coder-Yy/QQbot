[project]
name = "qqbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IT-coder-Yy", email = "953957772@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.16.2",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.0",
    "websockets>=17.1",
]

[project.scripts]
qqbot = "qqbot:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
